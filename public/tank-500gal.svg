<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Deep Satin Black GeePee Tank Plastic -->
    <linearGradient id="blackTank500" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14171d" />
      <stop offset="25%" stop-color="#2c323d" />
      <stop offset="50%" stop-color="#444d5e" />
      <stop offset="75%" stop-color="#232832" />
      <stop offset="100%" stop-color="#0c0e12" />
    </linearGradient>

    <linearGradient id="ribHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c212a" />
      <stop offset="35%" stop-color="#556075" />
      <stop offset="65%" stop-color="#3c4554" />
      <stop offset="100%" stop-color="#11141a" />
    </linearGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="400" height="320" fill="url(#bgGrad)" />

  <!-- Concrete Plinth / Stand -->
  <ellipse cx="200" cy="282" rx="122" ry="24" fill="#020617" opacity="0.9" />
  <ellipse cx="200" cy="278" rx="104" ry="18" fill="#1e293b" opacity="0.6" />

  <!-- 500 Gallons Classic GP Tank (Wide, Sturdy, Iconic Ribs) -->
  <g filter="url(#dropShadow)">
    <path d="M 120 78 C 120 54, 280 54, 280 78 L 275 264 C 275 276, 125 276, 125 264 Z" fill="url(#blackTank500)" />

    <!-- Center Top Inspection Manhole Lid with Steppes -->
    <ellipse cx="200" cy="54" rx="42" ry="11" fill="#181c24" stroke="#475569" stroke-width="2" />
    <ellipse cx="200" cy="51" rx="30" ry="7" fill="#2b323f" />
    <rect x="193" y="44" width="14" height="7" rx="2" fill="#64748b" />

    <!-- Rounded Upper Shoulder -->
    <path d="M 120 78 C 120 56, 280 56, 280 78 C 280 88, 120 88, 120 78 Z" fill="url(#ribHighlight)" />

    <!-- 7 Signature GeePee Reinforcement Circumferential Rings -->
    <path d="M 121 102 C 121 96, 279 96, 279 102 C 279 108, 121 108, 121 102 Z" fill="url(#ribHighlight)" />
    <path d="M 122 126 C 122 120, 278 120, 278 126 C 278 132, 122 132, 122 126 Z" fill="url(#ribHighlight)" />
    <path d="M 123 150 C 123 144, 277 144, 277 150 C 277 156, 123 156, 123 150 Z" fill="url(#ribHighlight)" />
    <path d="M 123 174 C 123 168, 277 168, 277 174 C 277 180, 123 180, 123 174 Z" fill="url(#ribHighlight)" />
    <path d="M 124 198 C 124 192, 276 192, 276 198 C 276 204, 124 204, 124 198 Z" fill="url(#ribHighlight)" />
    <path d="M 124 222 C 124 216, 276 216, 276 222 C 276 228, 124 228, 124 222 Z" fill="url(#ribHighlight)" />
    <path d="M 125 246 C 125 240, 275 240, 275 246 C 275 252, 125 252, 125 246 Z" fill="url(#ribHighlight)" />

    <path d="M 125 260 C 125 252, 275 252, 275 260 C 275 270, 125 270, 125 260 Z" fill="#14171d" />

    <!-- Iconic GeePee Logo in Bright Stenciled White (As seen in photo) -->
    <g transform="translate(178, 114) scale(0.75)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 30 5 L 56 35 L 30 70 L 4 35 Z" stroke-width="3.5" opacity="0.35" />
      <path d="M 27 12 C 12 12, 10 28, 10 40 C 10 54, 16 62, 30 62 L 30 10" />
      <path d="M 20 40 L 30 40" stroke-width="4.5" />
      <path d="M 30 10 L 30 62" />
      <path d="M 30 14 C 44 14, 48 24, 48 32 C 48 40, 42 46, 30 46" />
    </g>

    <!-- GEEPEE Text (Exactly matching Nigeria GeePee font) -->
    <text x="200" y="180" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="17" fill="#ffffff" letter-spacing="3">GEEPEE</text>
    <text x="200" y="193" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="8" fill="#cbd5e1" letter-spacing="1.5">2,500 LITRES • FOOD GRADE</text>

    <!-- Side Light Sheen -->
    <path d="M 148 80 L 172 80 L 165 262 L 142 262 Z" fill="url(#sheen)" />
  </g>

  <!-- Popular Badge & Capacity -->
  <g transform="translate(24, 24)">
    <rect width="145" height="28" rx="8" fill="#0891b2" fill-opacity="0.9" stroke="#22d3ee" stroke-width="1" />
    <text x="72" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">500 GAL (2,270L)</text>
  </g>
</svg>

