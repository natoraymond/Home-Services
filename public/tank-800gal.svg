<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Heavy-Duty Black Plastic GeePee Gradient -->
    <linearGradient id="blackTank800" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12151a" />
      <stop offset="25%" stop-color="#262b35" />
      <stop offset="50%" stop-color="#404959" />
      <stop offset="75%" stop-color="#1f232b" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </linearGradient>

    <linearGradient id="ribHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1e26" />
      <stop offset="35%" stop-color="#515b6e" />
      <stop offset="65%" stop-color="#373e4b" />
      <stop offset="100%" stop-color="#0e1014" />
    </linearGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="400" height="320" fill="url(#bgGrad)" />

  <ellipse cx="200" cy="286" rx="128" ry="24" fill="#020617" opacity="0.9" />

  <!-- 800 Gallons GP Tank (Tall & Stately Cylinder) -->
  <g filter="url(#dropShadow)">
    <path d="M 115 72 C 115 48, 285 48, 285 72 L 280 268 C 280 280, 120 280, 120 268 Z" fill="url(#blackTank800)" />

    <!-- Top Cap / Vent Lid -->
    <ellipse cx="200" cy="48" rx="44" ry="11" fill="#181c24" stroke="#475569" stroke-width="2" />
    <ellipse cx="200" cy="45" rx="32" ry="7" fill="#2b323f" />
    <rect x="193" y="38" width="14" height="7" rx="2" fill="#64748b" />

    <path d="M 115 72 C 115 50, 285 50, 285 72 C 285 82, 115 82, 115 72 Z" fill="url(#ribHighlight)" />

    <!-- Heavy Horizontal Rings (Tightly Spaced) -->
    <path d="M 116 94 C 116 88, 284 88, 284 94 C 284 100, 116 100, 116 94 Z" fill="url(#ribHighlight)" />
    <path d="M 117 116 C 117 110, 283 110, 283 116 C 283 122, 117 122, 117 116 Z" fill="url(#ribHighlight)" />
    <path d="M 117 138 C 117 132, 283 132, 283 138 C 283 144, 117 144, 117 138 Z" fill="url(#ribHighlight)" />
    <path d="M 118 160 C 118 154, 282 154, 282 160 C 282 166, 118 166, 118 160 Z" fill="url(#ribHighlight)" />
    <path d="M 118 182 C 118 176, 282 176, 282 182 C 282 188, 118 188, 118 182 Z" fill="url(#ribHighlight)" />
    <path d="M 119 204 C 119 198, 281 198, 281 204 C 281 210, 119 210, 119 204 Z" fill="url(#ribHighlight)" />
    <path d="M 119 226 C 119 220, 281 220, 281 226 C 281 232, 119 232, 119 226 Z" fill="url(#ribHighlight)" />
    <path d="M 120 248 C 120 242, 280 242, 280 248 C 280 254, 120 254, 120 248 Z" fill="url(#ribHighlight)" />

    <path d="M 120 264 C 120 256, 280 256, 280 264 C 280 274, 120 274, 120 264 Z" fill="#12151a" />

    <!-- Authentic GeePee Stencil Logo -->
    <g transform="translate(176, 110) scale(0.8)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 30 5 L 56 35 L 30 70 L 4 35 Z" stroke-width="3.5" opacity="0.35" />
      <path d="M 27 12 C 12 12, 10 28, 10 40 C 10 54, 16 62, 30 62 L 30 10" />
      <path d="M 20 40 L 30 40" stroke-width="4.5" />
      <path d="M 30 10 L 30 62" />
      <path d="M 30 14 C 44 14, 48 24, 48 32 C 48 40, 42 46, 30 46" />
    </g>

    <text x="200" y="178" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="3.5">GEEPEE</text>
    <text x="200" y="192" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="8.5" fill="#cbd5e1" letter-spacing="1.5">3,600 LITRES • EXTRA RIGID</text>

    <!-- Sheen reflection -->
    <path d="M 144 74 L 168 74 L 160 266 L 138 266 Z" fill="url(#sheen)" />
  </g>

  <!-- Capacity Badge -->
  <g transform="translate(24, 24)">
    <rect width="145" height="28" rx="8" fill="#0284c7" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <text x="72" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">800 GAL (3,600L)</text>
  </g>
</svg>

